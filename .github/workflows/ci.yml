name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: workflow
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workflow -d workflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NUXT_DATABASE_URL: postgres://workflow:workflow@127.0.0.1:5432/workflow
      NUXT_SESSION_SECRET: ci-session-secret-at-least-thirty-two-characters
      NUXT_PUBLIC_SITE_URL: http://127.0.0.1:3400
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:setup
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
