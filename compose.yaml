services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: workflow
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NUXT_DATABASE_URL: postgres://workflow:workflow@postgres:5432/workflow
      NUXT_SESSION_SECRET: ${NUXT_SESSION_SECRET:-local-compose-session-secret-change-in-production}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3000}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "3000:3000"
    volumes:
      - uploads-data:/app/.data
    restart: unless-stopped

volumes:
  postgres-data:
  uploads-data:
